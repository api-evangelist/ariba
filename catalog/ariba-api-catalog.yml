description: >-
  The authoritative, machine-readable inventory of every REST API SAP publishes for
  Ariba, harvested unauthenticated from the SAP Business Accelerator Hub OData
  catalogue (HTTP 200, application/json). 114 API artifacts with name, display name,
  version, sub-type and SAP's own one-line description.
  CONTRACT DISCOVERY OUTCOME: the catalogue is anonymous, the SPECS ARE NOT. Every
  artifact's $value download and every api.sap.com/api/{name}/overview page redirects
  to https://sappubliccatalog.authentication.eu10.hana.ondemand.com (SAP ID login),
  and developer.ariba.com serves an Angular shell for every path including
  /openapi.json. So SAP publishes 114 OpenAPI documents for Ariba and releases none
  of them anonymously. That is why openapi/ in this repo is empty - not because the
  contracts do not exist.
ownership_note: >-
  SAP acquired Ariba in 2012 and the surface is branded SAP Ariba throughout. The
  catalogue package is literally named SAPAribaOpenAPIs, every artifact description
  names an Ariba or SAP Business Network product, and the runtime gateway is
  openapi.ariba.com - an ariba.com host. Same company.
gateway: https://openapi.ariba.com
api_count: 114
