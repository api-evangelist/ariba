derivation_note: >-
  No candidate tool list is derived here. The pipeline derives candidates from an
  OpenAPI's operations, and SAP publishes none of Ariba's 114 OpenAPI documents
  anonymously - every $value download and every api.sap.com overview page redirects to
  an SAP ID login. Deriving tool names from documentation prose would produce a tool
  list with no inputSchema and no verified operationIds, which is worse than nothing.
  See catalog/ariba-api-catalog.yml for the real 114-API inventory a future MCP
  derivation would draw on if SAP opened the specs.
what_would_change_this:
