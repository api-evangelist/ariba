description: >-
  Live probe of the RFC 8615 /.well-known/ namespace across every host SAP Ariba
  publishes or documents. One real document was served: an RFC 9116 security.txt
  on ariba.com (and www.ariba.com), pointing at SAP's central vulnerability
  report form. Everything else is absent. Two hosts return misleading 200s and
  are recorded as misses: developer.ariba.com is an Angular single-page app whose
  catch-all route answers 200 with the same 4,196-byte HTML shell for every path,
  and api.sap.com / help.sap.com answer 200 with a login-redirect or portal shell.
  openapi.ariba.com, the real API gateway, answers 403 with a JSON gateway message
  for every unauthenticated path.
