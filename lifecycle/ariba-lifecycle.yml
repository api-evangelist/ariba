      source: https://help.sap.com/docs/ARIBA_APIS/4f4056d3846a477d902603266522af43/360a8f86c7c94dfa98fdf00240307143.html
    - api: Event Management API
      active: v2
      deprecated: [v1]
      as_of: 2202 (February 2022)
      source: https://help.sap.com/docs/ARIBA_APIS/0414af6b17164879920cf26608ae643d/8175368aca1c4b06a66f1586a92bb81e.html
    - api: Questionnaires API
      active: null
      deprecated: [all]
      as_of: 2002 (Q1 2020)
      note: Replaced by the Supplier Data API with Pagination. Only ever available in some data centres.
      source: https://help.sap.com/docs/ARIBA_APIS/60ec8b8bb9344dbe8dcf15e2a1edc85b/54e59f9676014fe9a5b4a2b752a3e12e.html
  multi_version_apis_in_catalog: 16
  multi_version_note: >-
    The SAP Business Accelerator Hub catalogue for the SAP Ariba Open APIs package
    lists 114 API artifacts, of which 16 carry an explicit _v2/_v3/_v4 sibling -
    approval, audit_search, bizmonservice, customforms (v2/v3/v4), procurement_eventstatus,
    product_hierarchy, risk_engagement, risk_exposure (v2/v3), sourcing_approval,
    sourcing_event, sourcing_event_public_notice, sourcing_project_management,
    strategicsourcing_eventstatus, supplier_invite, supplier_management,
    supplierdatapagination (v2/v3/v4).
status_page:
  published: false
  probes:
    - url: https://status.ariba.com
      status: NXDOMAIN
      note: >-
        The status.ariba.com pointer previously carried in apis.yml does not resolve in
        DNS at all. Removed rather than left as a false claim.
    - url: https://status.sap.com
      status: TLS-mismatch
      note: Certificate does not match the hostname; not a served SAP status surface.
  note: >-
    SAP Ariba operational status for customers is delivered through SAP Ariba Connect
    (support.ariba.com / connect.ariba.com, both of which now redirect to
    help.ariba.com) behind a customer login. No anonymous status page was found, so no
    StatusPage pointer is emitted.
sla:
  published: false
  note: >-
    Service levels are contracted through the customer's SAP Ariba subscription; SAP
    does not publish an anonymous API SLA for this surface.
