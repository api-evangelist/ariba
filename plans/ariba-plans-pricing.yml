provider: Ariba
providerId: ariba
description: >-
  Plans and pricing for the SAP Ariba API surface. REPLACES a scaffold written by
  the 2026-05-04 bulk sweep that invented Free / Professional / Enterprise tiers
  with prices and quotas SAP has never published. The honest finding is zero: SAP
  publishes no per-plan, per-tier or metered price list for the Ariba APIs. API
  access is not a product you buy; it is an entitlement of an existing SAP Ariba
  subscription, granted per client application through an approval workflow.
plan_count: 0
plans: []
access_model:
  model: entitlement-with-approval
  self_serve: false
  public_price_list: false
  free_tier: false
  description: >-
    A developer registers on the SAP Ariba Developer Portal and creates an
    application. An Organization admin on the customer's realm then requests API
    access for that application. Production OAuth credentials are issued only after
    SAP Ariba API administration approves the request - SAP states plainly that
    "Only applications approved by the SAP Ariba APIs administration can execute
    OAuth authentication." There is no price attached to that grant that SAP
    publishes; the commercial relationship is the underlying SAP Ariba /
    SAP Business Network subscription.
  evidence:
    - url: https://help.sap.com/docs/ARIBA_APIS/b61dd8c7e22c4fe489f191f66b4c48d6/5124973951a54a05a6cfaab3243e9a47.html
      note: Requesting API Access for an Application on the SAP Ariba Developer Portal.
    - url: https://help.sap.com/docs/ARIBA_APIS/60ec8b8bb9344dbe8dcf15e2a1edc85b/c0bbcab38ed54abf9d9a1ef9d26f122d.html
      note: >-
        "Only applications approved by the SAP Ariba APIs administration can execute
        OAuth authentication."
probes:
  - url: https://www.sap.com/products/spend-management/pricing.html
    status: 403
    note: >-
      SAP's spend-management pricing page exists but is behind an Akamai bot policy;
      our crawler received an "Access Denied" edge response, not a 404. Recorded as
      unreadable-to-us rather than absent. Even when read by a human it prices the SAP
      Ariba solutions, not API calls.
  - url: https://developer.ariba.com/api/apis
    status: 200
    note: >-
      The developer portal's API catalogue route. Returns the Angular shell to an
      anonymous crawler; the per-API discovery pages that would carry entitlement and
      rate-limit detail require a portal login.
