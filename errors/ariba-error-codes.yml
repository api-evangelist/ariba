method: searched
source: https://help.sap.com/docs/ARIBA_APIS (per-API "Error Messages Returned by ..." pages)
provider: Ariba
providerId: ariba
description: >-
  Error catalogue for the SAP Ariba API surface. SAP does not publish one central
  error registry; instead nearly every API in the catalogue ships its own
  "Error Messages Returned by <API>" or "Response Codes for <API>" page. The
  cross-cutting envelope and the status-code semantics below are common to the
  gateway; the per-API tables layer product-specific codes on top. Derived from the
  cited documentation pages, not from a spec - SAP publishes no anonymous OpenAPI
  for these APIs.
format: proprietary
rfc9457: false
envelope:
  shape: |
    { "error": { "code": 400, "message": "The API requires either the ITK display name or the Internal Event Name." } }
  fields:
    - name: error.code
      type: integer
      description: Mirrors the HTTP status code.
    - name: error.message
      type: string
      description: Human-readable message. Not stable across versions; do not branch on it.
  content_type: application/json
  note: >-
    This is NOT application/problem+json. There is no type URI, no title/detail split
    and no instance - an agent cannot dereference an error to a documented problem
    type. Several APIs (Asset Management, Materials and BOM Tag Management, the SCIM
    API) additionally return a product-specific string code such as
    containsLargeNumberOfRecords, featureNotEnabled, missingRequiredBody or reqNotFound
    alongside the HTTP status.
  source: https://help.sap.com/docs/ARIBA_APIS/4a02653030b44d628d8b0d1d423cf58f/fd9ec9f53df844608c458efb3347c2de.html
status_codes:
  - status: 200
    meaning: Success.
  - status: 201
    meaning: Created. Returned by POST on APIs that create a resource.
  - status: 204
    meaning: >-
      No content. On the Asynchronous Job Requests API this specifically means
      "Error file not found for this job ID".
  - status: 400
    meaning: Bad request - malformed parameters, unparseable JSON, or a schema violation.
    common_causes:
      - The API key passed in the request is not valid.
      - Required identifying parameters are missing (e.g. ITK display name or Internal Event Name).
      - Invalid RSQL filter expression.
    remediation: Correct the request; do not retry unchanged.
  - status: 401
    meaning: Unauthorized - authentication failed.
    common_causes:
      - Token not found - the OAuth token is invalid or missing.
      - The bearer token has expired (tokens live 1,440 seconds).
      - The API key passed in the query headers does not match the API key in the OAuth token.
      - 'This client id: {ID} is not authorized to access the realm: {realm} for this API.'
      - The token scopes are not supported by the API.
      - Confirm your ANID and shared secret (on Basic-auth Business Network APIs).
    remediation: >-
      Refresh the access token and retry once. If the failure is realm- or
      scope-shaped, retrying will not help - the application's API-access grant is
      wrong and needs an administrator.
    source: https://help.sap.com/docs/ARIBA_APIS/c1aedced5c044a41b84be5312db93fc1/0607784ed86d45eeb137aab8470c096e.html
  - status: 403
    meaning: Forbidden - the query attempts to access a resource for which it does not have permission.
    remediation: Not retryable. The user or application lacks the entitlement.
  - status: 404
    meaning: Not found - the requested resource or job ID does not exist.
  - status: 429
    meaning: Rate limit error - "You have exceeded the maximum permitted query rate."
    remediation: >-
      Back off. There is no Retry-After header; use the X-RateLimit-Remaining-* headers
      and LastCallMade to compute the wait. See rate-limits/ariba-rate-limits.yml.
    retryable: true
  - status: 500
    meaning: Internal server error.
    common_causes:
      - 'Failed to authenticate, OAUTH server down - the OAuth server is unreachable.'
      - Exceptions encountered during JSON generation.
    retryable: true
  - status: 504
    meaning: Gateway time-out. The request took longer than the gateway allows.
    retryable: true
