agent_guidance:
  - Branch on the HTTP status and on the product-specific string code where one is present. Never branch on error.message.
  - 401 is ambiguous here - it covers expired token, wrong apiKey, wrong realm and missing scope. Only the expired-token case is worth an automatic retry.
  - 429 carries no Retry-After. Read the four X-RateLimit-Remaining-* counters instead.
