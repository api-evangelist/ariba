source: https://help.sap.com/docs/ARIBA_APIS/b61dd8c7e22c4fe489f191f66b4c48d6/792a3139e5c04f0cbbcbbd404506bc04.html
provider: Ariba
providerId: ariba
description: >-
  Change history for the SAP Ariba API surface. SAP does not publish a single dated
  API changelog feed. What it publishes instead is (a) a per-API "Version History"
  page pinning each version's status to a numbered SAP Ariba release, and (b) the SAP
  Business Accelerator Hub catalogue, whose OData endpoint returns a machine-readable
  ModifiedAt timestamp per API artifact. Those two together are the changelog, and
  both are anonymously readable. Recorded as a version-history changelog rather than
  an entries feed, because that is what exists.
scheme:
  type: release-train
  format: YYMM
  description: >-
    SAP Ariba ships on a numbered release train - 2602, 2502, 2408, 2306, 2208, 2202,
    2111, 2102, 2008, 2002 - and API version status changes are stated as "as of
    release <YYMM>".
current_release_observed: '2602'
machine_readable_feed:
  url: "https://api.sap.com/odata/1.0/catalog.svc/ContentEntities.ContentPackages('SAPAribaOpenAPIs')/Artifacts?$format=json"
  status: 200
  auth: none
  description: >-
    Returns all 114 REST API artifacts in the SAP Ariba Open APIs package with Name,
    DisplayName, Version, Description, State and a ModifiedAt epoch timestamp. This is
    the closest thing SAP publishes to a machine-readable change feed for the surface,
    and it needs no credentials. A sibling package, SAPAribaWebServices, returns 113
    SOAP artifacts the same way.
  note: >-
    The artifact bodies themselves ($value) redirect to an SAP ID login, so the
    catalogue is readable but the specs behind it are not.
