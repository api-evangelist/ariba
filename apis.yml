name: Ariba
description: 'SAP Ariba is the procurement and supply-chain collaboration business of SAP: strategic sourcing,
  contract management, procure-to-pay, supplier lifecycle and performance, supplier risk, catalog management,
  and the SAP Business Network that connects buyers and suppliers. Its API surface is one of the largest
  enterprise contract estates in the catalog - 114 REST APIs published in the SAP Business Accelerator
  Hub package SAPAribaOpenAPIs, plus 144 SOAP web services - all routed through the openapi.ariba.com
  gateway behind OAuth 2.0 client credentials, an application key, and a per-realm authorization grant.
  Ariba also authored cXML, the Commerce XML interchange standard the wider procurement market still runs
  on. The catalog metadata is anonymously readable; the specifications themselves are not - every OpenAPI
  download redirects to an SAP ID login.'
