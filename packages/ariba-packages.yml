method: searched
source: >-
  registry.npmjs.org search + package metadata endpoints, pypi.org JSON API,
  api.github.com repository search, and the SAP Ariba developer documentation
provider: Ariba
providerId: ariba
description: >-
  First-party client library search for the SAP Ariba API surface. The headline
  finding is an absence: SAP publishes 114 REST APIs and 144 SOAP web services for
  Ariba and ships NO first-party client SDK for any of them in npm, PyPI, Maven
  Central, NuGet, RubyGems, crates.io or pkg.go.dev. Integrators are expected to
  call the OAuth-protected gateway at openapi.ariba.com directly, or to use SAP
  Integration Suite / Cloud Integration content. The packages SAP does publish
  under the Ariba name are UI frameworks and sample code, not API clients - and the
  Ariba UI framework has not shipped a release since 2018.
