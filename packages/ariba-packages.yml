    description: Ariba UI core module providing basic set of API and services.
    note: >-
      First-party: the package homepage in the npm registry metadata is
      github.com/SAP/angular-metaui, an SAP-owned repository. This is the Ariba UI
      (MetaUI) Angular framework for building Ariba application screens - it is NOT a
      client for any SAP Ariba REST API. Last published 2018-10-23, nearly eight years
      before this probe; every REST API in the SAP Ariba catalog post-dates or has been
      re-versioned since. Treat as abandoned.
